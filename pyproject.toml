[project]
name = "shodan2db"
version = "0.1.0"
description = "Parse Shodan JSON exports into SQLite and generate HTML / osintracker reports."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = [
    "click>=8.1.7",
    "jinja2>=3.1.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.uv]
# Script-style project: run with `uv run shodan2db.py ...`
package = false

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
